<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <style>
    text { font-size: 15.5px; }
    .b { font-weight: 700; }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="896" height="426" rx="10" fill="#11111b" stroke="#313244" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="26" cy="24" r="6" fill="#f38ba8"/>
  <circle cx="46" cy="24" r="6" fill="#f9e2af"/>
  <circle cx="66" cy="24" r="6" fill="#a6e3a1"/>
  <text x="450" y="29" text-anchor="middle" fill="#6c7086">snake.claude — tmux</text>
  <line x1="12" y1="46" x2="888" y2="46" stroke="#313244" stroke-width="1"/>

  <!-- pane divider -->
  <line x1="452" y1="46" x2="452" y2="428" stroke="#313244" stroke-width="1.5"/>

  <!-- ================= LEFT PANE: Claude Code ================= -->
  <g xml:space="preserve">
    <text x="30" y="90"  fill="#cba6f7" class="b">✳ Claude Code</text>
    <text x="30" y="140" fill="#6c7086">&gt; <tspan fill="#cdd6f4">add tests for the parser</tspan></text>
    <text x="30" y="192" fill="#fab387" class="b">● Working…<tspan fill="#6c7086" class="b">  (esc to interrupt)</tspan></text>
    <text x="30" y="224" fill="#6c7086">  · Reading  src/parser.js</text>
    <text x="30" y="252" fill="#6c7086">  · Editing  tests/parser.test.js</text>
    <text x="30" y="280" fill="#6c7086">  · Running  42 tests …</text>
    <text x="30" y="360" fill="#585b70">── while you wait, play snake ──▶</text>
  </g>

  <!-- ================= RIGHT PANE: Snake (drawn geometrically) ================= -->
  <text x="574" y="104" class="b" fill="#b5f542">SNAKE <tspan fill="#6c7086" class="b">·claude</tspan></text>

  <!-- board border: 18 cols x 8 rows, cell = 17 -->
  <rect x="566" y="124" width="322" height="152" rx="6" fill="none" stroke="#45475a" stroke-width="1.5"/>

  <g>
    <!-- snake body (green) -->
    <rect x="627" y="147" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="644" y="147" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="661" y="147" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="678" y="147" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="627" y="164" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="627" y="181" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="644" y="181" width="13" height="13" rx="2.5" fill="#a6e3a1"/>
    <rect x="661" y="181" width="13" height="13" rx="2.5" fill="#a6e3a1"/>

    <!-- snake head (bright green diamond) -->
    <rect x="696" y="147" width="13" height="13" rx="2" fill="#b5f542" transform="rotate(45 702.5 153.5)"/>

    <!-- food (red pellet) -->
    <circle cx="753.5" cy="221.5" r="6.5" fill="#f38ba8"/>
  </g>

  <text x="574" y="308"><tspan fill="#89dceb">score </tspan><tspan class="b" fill="#89dceb">7</tspan><tspan fill="#6c7086">    best 12</tspan></text>
</svg>
