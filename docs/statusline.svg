<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <style>
    text { font-size: 15px; }
    .b { font-weight: 700; }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="856" height="416" rx="10" fill="#11111b" stroke="#313244" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="26" cy="24" r="6" fill="#f38ba8"/>
  <circle cx="46" cy="24" r="6" fill="#f9e2af"/>
  <circle cx="66" cy="24" r="6" fill="#a6e3a1"/>
  <text x="430" y="29" text-anchor="middle" fill="#6c7086">Claude Code</text>
  <line x1="12" y1="46" x2="848" y2="46" stroke="#313244" stroke-width="1"/>

  <!-- conversation -->
  <g xml:space="preserve">
    <text x="26" y="86"  fill="#cba6f7" class="b">✳ Claude Code</text>
    <text x="26" y="126" fill="#6c7086">&gt; <tspan fill="#cdd6f4">refactor the auth module</tspan></text>
    <text x="26" y="166" fill="#fab387" class="b">● Working…<tspan fill="#6c7086" class="b">  (esc to interrupt)</tspan></text>
    <text x="26" y="196" fill="#6c7086">  · Reading  src/auth.js</text>
    <text x="26" y="224" fill="#6c7086">  · Editing  src/auth.js</text>
  </g>

  <!-- status-line band (highlighted) -->
  <rect x="12" y="300" width="836" height="66" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
  <g xml:space="preserve">
    <!-- HUD row -->
    <text x="26" y="326"><tspan fill="#ffffff" class="b">Opus 4.8</tspan><tspan fill="#585b70">  ·  </tspan><tspan fill="#a6e3a1">●</tspan><tspan fill="#f9e2af"> thinking</tspan><tspan fill="#585b70">  ·  </tspan><tspan fill="#6c7086">ctx 42%</tspan><tspan fill="#585b70">  ·  </tspan><tspan fill="#6c7086">4s</tspan><tspan fill="#585b70">  ·  </tspan><tspan fill="#89dceb">2 agents</tspan></text>
    <!-- Pong row -->
    <text x="26" y="352"><tspan fill="#6c7086">❚</tspan><tspan fill="#585b70">        </tspan><tspan fill="#ffffff" class="b">●</tspan><tspan fill="#585b70">                          </tspan><tspan fill="#6c7086">❚</tspan><tspan fill="#585b70">   </tspan><tspan fill="#89dceb">3:2</tspan></text>
  </g>

  <!-- caption -->
  <text x="26" y="392" xml:space="preserve" fill="#585b70">↑ your Claude status line — it auto-plays while Claude works, and shows what Claude's doing.</text>
</svg>
