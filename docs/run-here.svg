<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <style>
    text { font-size: 15.5px; }
    .b { font-weight: 700; }
  </style>

  <!-- window: Claude running inside tmux -->
  <rect x="2" y="2" width="816" height="296" rx="10" fill="#11111b" stroke="#313244" stroke-width="1.5"/>
  <circle cx="26" cy="24" r="6" fill="#f38ba8"/>
  <circle cx="46" cy="24" r="6" fill="#f9e2af"/>
  <circle cx="66" cy="24" r="6" fill="#a6e3a1"/>
  <text x="410" y="29" text-anchor="middle" fill="#6c7086">tmux — Claude Code</text>
  <line x1="12" y1="46" x2="808" y2="46" stroke="#313244" stroke-width="1"/>

  <g xml:space="preserve">
    <text x="30" y="86" fill="#cba6f7" class="b">✳ Claude Code</text>
    <text x="30" y="118" fill="#6c7086">  one-time setup:  <tspan fill="#a6e3a1">tmux</tspan>  →  <tspan fill="#a6e3a1">claude</tspan>   (so Claude runs inside tmux)</text>

    <!-- Claude's input box with the ! command typed in -->
    <rect x="30" y="150" width="760" height="46" rx="8" fill="#181825" stroke="#585b70" stroke-width="1.3"/>
    <text x="48" y="179"><tspan fill="#6c7086">&gt; </tspan><tspan fill="#f9e2af" class="b">!</tspan><tspan fill="#cdd6f4" class="b">npx snake.claude</tspan></text>
    <rect x="242" y="167" width="9" height="17" fill="#cdd6f4" opacity="0.8"/>

    <text x="30" y="238" fill="#fab387">↑ type this <tspan class="b">inside Claude</tspan> — Snake opens in the pane right beside it.</text>
    <text x="30" y="266" fill="#585b70">  It plays while Claude works and pauses the moment Claude replies.</text>
  </g>
</svg>
